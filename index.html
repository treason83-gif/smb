<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMB Leads Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-strong: rgba(56, 189, 248, 0.35);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: rgba(148, 163, 184, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 45%, #000 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 16px 40px;
    }

    header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title span.badge {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid var(--accent-strong);
      color: var(--accent);
      background: var(--accent-soft);
      text-transform: none;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .panel {
      border-radius: 20px;
      padding: 18px 18px 14px;
      background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.9),
        rgba(15, 23, 42, 0.7)
      );
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.7),
        0 0 0 1px rgba(15, 23, 42, 1);
      backdrop-filter: blur(14px);
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 0.7fr;
      gap: 12px;
      align-items: flex-end;
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .field-input {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: radial-gradient(circle at top left, #1f2937 0, #020617 65%);
      color: var(--text-main);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease,
        background 0.16s ease;
      width: 100%;
      appearance: none;
    }

    .field-input::placeholder {
      color: #6b7280;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.5),
        0 0 25px rgba(56, 189, 248, 0.35);
      background: radial-gradient(circle at top left, #111827 0, #020617 70%);
    }

    select.field-input {
      padding-right: 26px;
      background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%),
        linear-gradient(135deg, #6b7280 50%, transparent 50%);
      background-position: calc(100% - 14px) 9px, calc(100% - 9px) 9px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 15px 2px 0;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border-radius: 999px;
      padding: 3px 9px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: radial-gradient(circle at top left, #1f2937 0, #020617 70%);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle, #22d3ee, #0284c7);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
    }

    .results {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      border-radius: 18px;
      padding: 12px 13px 11px;
      background: radial-gradient(circle at top left, #111827 0, #020617 68%);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: conic-gradient(
        from 210deg,
        rgba(56, 189, 248, 0.3),
        transparent 40%,
        transparent 70%,
        rgba(56, 189, 248, 0.5),
        rgba(56, 189, 248, 0.3)
      );
      opacity: 0;
      z-index: -1;
      transition: opacity 0.2s ease;
    }

    .card:hover::before {
      opacity: 0.4;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: flex-start;
    }

    .card-name {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.25;
    }

    .card-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.09);
      border: 1px solid rgba(56, 189, 248, 0.5);
      white-space: nowrap;
    }

    .card-line {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .card-label {
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 10px;
      color: #6b7280;
      min-width: 70px;
      flex-shrink: 0;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: radial-gradient(circle at top left, #111827 0, #020617 68%);
      color: var(--text-main);
      font-size: 11px;
      padding: 5px 10px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease,
        transform 0.08s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      border-color: rgba(56, 189, 248, 0.7);
      background: radial-gradient(circle at top left, #0b1120 0, #020617 74%);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
      transform: translateY(-0.5px);
    }

    .btn.primary {
      border-color: rgba(56, 189, 248, 0.9);
      background: linear-gradient(135deg, #0ea5e9, #22c55e);
    }

    .btn.primary:hover {
      box-shadow: 0 12px 28px rgba(34, 211, 238, 0.55);
    }

    .btn-icon {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.9);
      background: radial-gradient(circle, #e5e7eb, #d1d5db);
    }

    .empty-state {
      padding: 24px 0 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .phone-link {
      color: var(--text-main);
      text-decoration: none;
    }

    .phone-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title">
        SMB Leads
        <span class="badge">Interactive directory</span>
      </div>
      <p class="subtitle">
        Search by name, filter by category and by
        <strong># of Employees</strong>, then click through to Google Maps or the
        business website.
      </p>
    </header>

    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="searchInput">Search by name</label>
          <input
            id="searchInput"
            class="field-input"
            type="text"
            placeholder="Start typing a business name..."
          />
        </div>

        <div class="field">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter" class="field-input">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="field">
          <label for="employeesFilter"># of Employees</label>
          <select id="employeesFilter" class="field-input">
            <option value="">All sizes</option>
          </select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button id="resetBtn" class="btn" type="button">
            <span class="btn-icon"></span>
            Reset filters
          </button>
        </div>
      </div>

      <div class="meta-row">
        <div class="chip">
          <span class="chip-dot"></span>
          <span><span id="resultCountNumber">0</span> businesses</span>
        </div>
      </div>

      <div id="results" class="results"></div>
      <div id="emptyMessage" class="empty-state" style="display:none;">
        No businesses match your filters. Try clearing one of the filters.
      </div>
    </section>
  </div>

  <script>
    let allBusinesses = [];

    function mapRecord(rec) {
      return {
        name: rec.NOM_ASSUJ || rec.Name || "",
        category: rec.categoryName || "",
        city: rec.city || "",
        neighborhood: rec.neighborhood || "",
        postalCode: rec.postalCode || "",
        street: rec.street || "",
        phone: rec.phone || "",
        website: rec.website || "",
        url: rec.url || "",
        codEmployees: rec.COD_INTVAL_EMPLO_QUE || "",
        employees:
          rec["# of Employees"] ??
          rec["# of Employees "] ??
          rec["# of employees"] ??
          ""
      };
    }

    function initFilters() {
      const categorySelect = document.getElementById("categoryFilter");
      const employeesSelect = document.getElementById("employeesFilter");

      const categories = Array.from(
        new Set(allBusinesses.map(b => b.category).filter(Boolean))
      ).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });

      const employeeValues = Array.from(
        new Set(
          allBusinesses
            .map(b => b.employees)
            .filter(v => v && String(v).trim() !== "")
        )
      ).sort((a, b) =>
        String(a).localeCompare(String(b), undefined, { sensitivity: "base" })
      );

      employeeValues.forEach(val => {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = val;
        employeesSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const searchText = document
        .getElementById("searchInput")
        .value.trim()
        .toLowerCase();
      const category = document.getElementById("categoryFilter").value;
      const employeesFilter = document.getElementById("employeesFilter").value;

      const filtered = allBusinesses.filter(biz => {
        if (searchText) {
          const haystack = (biz.name || "").toLowerCase();
          if (!haystack.includes(searchText)) return false;
        }

        if (category && biz.category !== category) return false;

        if (employeesFilter && String(biz.employees) !== employeesFilter) return false;

        return true;
      });

      renderResults(filtered);
    }

    function renderResults(list) {
      const resultsEl = document.getElementById("results");
      const emptyEl = document.getElementById("emptyMessage");
      const countEl = document.getElementById("resultCountNumber");

      resultsEl.innerHTML = "";
      countEl.textContent = list.length.toLocaleString("en-CA");

      if (list.length === 0) {
        emptyEl.style.display = "block";
        return;
      } else {
        emptyEl.style.display = "none";
      }

      const fragments = [];

      list.forEach(biz => {
        const addressParts = [biz.street, biz.city, biz.postalCode]
          .filter(Boolean)
          .join(", ");
        const address = addressParts || "N/A";

        let employeesText = "Unknown";
        if (biz.employees && String(biz.employees).trim() !== "") {
          employeesText = biz.employees;
        } else if (biz.codEmployees) {
          employeesText = `Code ${biz.codEmployees}`;
        }

        const html = `
          <article class="card">
            <div class="card-header">
              <div>
                <div class="card-name">${biz.name || "Untitled business"}</div>
                ${
                  biz.category
                    ? `<div class="card-category">${biz.category}</div>`
                    : ""
                }
              </div>
            </div>

            <div class="card-body">
              <div class="card-line">
                <div class="card-label">Address</div>
                <div>${address}</div>
              </div>

              ${
                biz.neighborhood
                  ? `<div class="card-line">
                      <div class="card-label">Area</div>
                      <div>${biz.neighborhood}</div>
                    </div>`
                  : ""
              }

              <div class="card-line">
                <div class="card-label">Employees</div>
                <div>${employeesText}</div>
              </div>

              ${
                biz.phone
                  ? `<div class="card-line">
                      <div class="card-label">Phone</div>
                      <div><a class="phone-link" href="tel:${biz.phone}">${biz.phone}</a></div>
                    </div>`
                  : ""
              }

              <div class="card-actions">
                ${
                  biz.website
                    ? `<a class="btn" href="${biz.website}" target="_blank" rel="noreferrer">
                         <span class="btn-icon"></span> Website
                       </a>`
                    : ""
                }
                ${
                  biz.url
                    ? `<a class="btn primary" href="${biz.url}" target="_blank" rel="noreferrer">
                         <span class="btn-icon"></span> Google Maps
                       </a>`
                    : ""
                }
              </div>
            </div>
          </article>
        `;

        fragments.push(html);
      });

      resultsEl.innerHTML = fragments.join("");
    }

    function setupEvents() {
      document
        .getElementById("searchInput")
        .addEventListener("input", applyFilters);
      document
        .getElementById("categoryFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("employeesFilter")
        .addEventListener("change", applyFilters);
      document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("categoryFilter").value = "";
        document.getElementById("employeesFilter").value = "";
        applyFilters();
      });
    }

    async function loadData() {
      try {
        const res = await fetch("SMB_Leads.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to load SMB_Leads.json");
        const raw = await res.json();
        if (!Array.isArray(raw)) throw new Error("JSON root is not an array");
        allBusinesses = raw.map(mapRecord);
        initFilters();
        applyFilters();
      } catch (err) {
        console.error(err);
        const empty = document.getElementById("emptyMessage");
        empty.style.display = "block";
        empty.textContent =
          "Could not load SMB_Leads.json. Make sure it is in the same GitHub repo folder as this HTML and that you open it via your GitHub Pages URL, not as a local file.";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      setupEvents();
      loadData();
    });
  </script>
</body>
</html>
